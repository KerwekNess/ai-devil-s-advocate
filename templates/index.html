<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDEA KILLER | Адвокат Дьявола</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #ffffff;
        --muted: #888;
        --card: rgba(20, 20, 20, 0.9);
        --accent: #ff1a1a;
        --bg-dark: #0a0a0a;
      }

      * { box-sizing: border-box; }

      html, body { 
        margin: 0; 
        min-height: 100%; 
        background-color: var(--bg-dark);
        overflow-x: hidden;
      }

      body {
        font-family: 'Oswald', sans-serif;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
        background: radial-gradient(circle at center, #1a0000 0%, #0a0a0a 100%);
        transition: background 0.5s ease;
      }

      /* 1. Full-screen Heat Glow (The "Heat" effect) */
      body::after {
        content: '';
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 0;
        background: radial-gradient(ellipse at bottom, var(--accent), transparent 70%);
        opacity: 0;
        z-index: 1;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }

      body.is-thinking::after {
        opacity: 0.5;
        animation: heatPulse 5s ease-in-out infinite;
      }

      @keyframes heatPulse {
        0% { height: 0%; opacity: 0; }
        20% { height: 40%; opacity: 0.5; } 
        100% { height: 60%; opacity: 0; } 
      }

      /* 4. Particle Canvas */
      #particle-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* 2. Click Ripple (The "Heat Click") */
      .heat-ripple {
        position: fixed;
        border-radius: 50%;
        background: rgba(255, 26, 26, 0.4);
        pointer-events: none;
        z-index: 100;
        transform: scale(0);
      }

      main {
        position: relative;
        z-index: 10;
        width: min(700px, calc(100% - 40px));
        margin: 10vh auto; /* 1. Safe Zone */
        padding: 40px;
        background: var(--card);
        border: 1px solid rgba(255, 26, 26, 0.2);
        border-radius: 12px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(20px);
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 3.5rem);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0 0 10px;
        text-align: center;
        background: linear-gradient(to bottom, #ffffff, #ff1a1a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin-bottom: 30px;
        font-size: 1.1rem;
        letter-spacing: 1px;
      }

      /* 4. Mode Switcher: Ordered [Formal, Roast] */
      .mode-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .mode-btn {
        background: #111;
        border: 1px solid #444;
        color: #666;
        padding: 8px 15px;
        font-size: 0.9rem;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.3s;
        font-family: 'Oswald', sans-serif;
      }

      .mode-btn.active {
        color: var(--accent);
        border-color: var(--accent);
        background: rgba(255, 26, 26, 0.1);
        box-shadow: 0 0 10px rgba(255, 26, 26, 0.3);
      }

      form { display: grid; gap: 20px; }

      textarea {
        width: 100%;
        min-height: 120px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: white;
        font-family: 'Oswald', sans-serif;
        font-size: 1.2rem;
        outline: none;
        resize: none; /* 6. No resize handle */
        transition: border-color 0.3s;
      }

      textarea:focus { border-color: var(--accent); }

      button#submitBtn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 18px;
        font-family: 'Oswald', sans-serif;
        font-size: 1.4rem;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.3s;
        letter-spacing: 2px;
      }

      button#submitBtn:hover { 
        background: #e60000; 
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(255, 26, 26, 0.4);
      }

      button#submitBtn:disabled { background: #333; transform: none; }

      #result { margin-top: 40px; }

      /* 2. Cloud Shapes (Speech Bubbles) */
      .critique-item {
        position: relative;
        background: rgba(40, 40, 40, 0.9);
        padding: 20px 25px;
        border-radius: 30px; 
        margin-bottom: 20px;
        font-size: 1.2rem;
        line-height: 1.4;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 5px 10px 20px rgba(0,0,0,0.4);
      }

      .critique-item::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 30px;
        border-width: 10px 10px 0;
        border-style: solid;
        border-color: rgba(40, 40, 40, 0.9) transparent;
      }

      .critique-item:hover {
        transform: scale(1.03) translateX(5px);
        background: rgba(50, 50, 50, 1);
      }

      .critique-item:active { transform: scale(0.95); }

      /* 5. Copy Hint */
      .copy-hint {
        text-align: center;
        color: #555;
        font-size: 0.8rem;
        margin-top: 20px;
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0; /* 1. Hidden initially */
        transition: opacity 1s ease;
      }

      .error { color: var(--accent); text-align: center; padding: 20px; }

      .loader {
        width: 20px; height: 20px;
        border: 3px solid rgba(255,255,255,0.3);
        border-bottom-color: #fff;
        border-radius: 50%;
        display: inline-block;
        animation: rotation 1s linear infinite;
        vertical-align: middle;
        margin-right: 10px;
      }

      @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body id="mainBody">
    <canvas id="particle-canvas"></canvas>

    <main>
      <h1>УБИЙЦА ИДЕЙ</h1>
      <p class="subtitle">Введи свою идею. Пусть Дьявол найдет в ней дыры.</p>

      <!-- 4. Mode Switcher: [Formal, Roast] -->
      <div class="mode-container">
        <button class="mode-btn active" data-mode="formal">ФОРМАЛЬНЫЙ</button>
        <button class="mode-btn" data-mode="roast">ПРОЖАРКА</button>
      </div>

      <form id="ideaForm">
        <textarea id="ideaInput" placeholder="Например: 'Хочу бросить работу и открыть кофейню'..." required></textarea>
        <button type="submit" id="submitBtn">Убить мою идею</button>
      </form>

      <div id="result"></div>
      <!-- 5. Copy Hint -->
      <p class="copy-hint">Нажми на облако, чтобы скопировать</p>
    </main>

    <script>
      const form = document.getElementById('ideaForm');
      const btn = document.getElementById('submitBtn');
      const resultDiv = document.getElementById('result');
      const ideaInput = document.getElementById('ideaInput');
      const body = document.getElementById('mainBody');
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      const hint = document.querySelector('.copy-hint');

      let currentMode = 'formal'; // 4. Default: Formal
      let particles = [];

      // 6. Auto-expanding Textarea
      ideaInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
      });

      // 4. Mode Switcher
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
          b.classList.add('active');
          currentMode = b.dataset.mode;
        });
      });

      // 4. Particle System (Embers/Sparkles)
      function initParticles() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 80; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.5,
            speedY: (Math.random() - 0.5) * 0.5,
            color: Math.random() > 0.5 ? '#ff1a1a' : '#800000'
          });
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const isThinking = body.classList.contains('is-thinking');
        
        particles.forEach(p => {
          p.x += p.speedX;
          // 3. Rising Embers when thinking
          p.y += isThinking ? (Math.random() * 2 - 1) : p.speedY; 
          
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;

          ctx.fillStyle = isThinking ? '#ff4d00' : p.color;
          ctx.globalAlpha = isThinking ? 0.6 : 0.2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(animateParticles);
      }

      // 2. Heat Ripple (Click effect)
      document.addEventListener('mousedown', (e) => {
        const ripple = document.createElement('div');
        ripple.className = 'heat-ripple';
        ripple.style.left = `${e.clientX}px`;
        ripple.style.top = `${e.clientY}px`;
        document.body.appendChild(ripple);

        ripple.animate([
          { transform: 'translate(-50%, -50%) scale(0)', opacity: 1 },
          { transform: 'translate(-50%, -50%) scale(4)', opacity: 0 }
        ], { duration: 1000, easing: 'ease-out' });

        setTimeout(() => ripple.remove(), 1000);
      });

      // Parallax for immersive feel
      document.addEventListener('mousemove', (e) => {
        const moveX = (e.clientX / window.innerWidth - 0.5) * 15;
        const moveY = (e.clientY / window.innerHeight - 0.5) * 15;
        document.querySelectorAll('.blob').forEach(b => {
            b.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
      });

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      initParticles();
      animateParticles();

      // 5. Copy Logic
      async function copyToClipboard(text, element) {
        try {
          await navigator.clipboard.writeText(text);
          const originalText = element.textContent;
          element.textContent = '✅ СКОПИРОВАНО!';
          element.style.color = '#00ff00';
          setTimeout(() => {
            element.textContent = originalText;
            element.style.color = '';
          }, 1000);
        } catch (err) {
          console.error('Copy failed', err);
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const idea = ideaInput.value.trim();
        if (!idea) return;

        resultDiv.innerHTML = '';
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Дьявол размышляет...';
        body.classList.add('is-thinking');

        try {
          const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idea, mode: currentMode })
          });

          const data = await response.json();

          if (!response.ok) throw new Error(data.error || 'Дьявол не явился.');

          resultDiv.innerHTML = '';
          data.items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'critique-item';
            div.textContent = item;
            div.addEventListener('click', () => copyToClipboard(item, div));
            resultDiv.appendChild(div);
          });

          // 1. Show hint only after results
          hint.style.opacity = '1';

        } catch (err) {
          resultDiv.innerHTML = `<div class="error">🔥 ${err.message}</div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Убить мою идею';
          setTimeout(() => body.classList.remove('is-thinking'), 100);
        }
      });
    </script>
  </body>
</html>
